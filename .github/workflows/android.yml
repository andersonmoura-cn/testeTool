name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Restaurar chave de assinatura (debug)
        run: base64 -d app/debug.keystore.b64 > app/debug.keystore

      - name: Testes do motor de regras
        run: gradle -p engine test --no-daemon

      - name: Gerar APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk XadrezRPG.apk

      - uses: actions/upload-artifact@v4
        with:
          name: XadrezRPG-apk
          path: XadrezRPG.apk

      - name: Publicar na Release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Xadrez RPG (última versão)
          prerelease: false
          make_latest: true
          body: |
            APK gerado automaticamente a partir do commit ${{ github.sha }} (branch ${{ github.ref_name }}).
            Baixe o arquivo **XadrezRPG.apk** abaixo pelo navegador do celular e instale.
          files: XadrezRPG.apk

  ui-test:
    # Abre o app num emulador Android e joga alguns turnos (app/src/androidTest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compilar app e teste
        run: |
          base64 -d app/debug.keystore.b64 > app/debug.keystore
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Rodar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/run-ui-test.sh

      - name: Publicar fotos e resultado na Release "testes"
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: testes
          target_commitish: ${{ github.sha }}
          name: Resultados do teste no emulador
          prerelease: true
          make_latest: false
          body: Fotos da tela e saída do teste automático (commit ${{ github.sha }}).
          files: ui-results/*
