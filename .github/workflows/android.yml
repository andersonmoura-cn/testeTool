name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes do motor de regras
        run: ./gradlew -p engine test --no-daemon

      - name: Gerar APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk XadrezRPG.apk

      - uses: actions/upload-artifact@v4
        with:
          name: XadrezRPG-apk
          path: XadrezRPG.apk

      - name: Publicar na Release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Xadrez RPG (última versão)
          prerelease: false
          make_latest: true
          body: |
            APK gerado automaticamente a partir do commit ${{ github.sha }} (branch ${{ github.ref_name }}).
            Baixe o arquivo **XadrezRPG.apk** abaixo pelo navegador do celular e instale.
          files: XadrezRPG.apk
